<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter with JS</title>
  </head>
  <body>
    <div id="counter">0</div>
    <button id="btn">Click Me</button>

    <script>
      const btn = document.getElementById('btn');
      let counter = document.getElementById('counter');   // 0

      btn.addEventListener('click', () => {
        let num = parseInt(counter.innerHTML);            // yaha 0 ko parseint se integer me liya h innerHTML se.
        counter.innerHTML = num + 1;
      });
    </script>
  </body>
</html>

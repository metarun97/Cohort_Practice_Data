     <!-- Navbar HTML and Tailwind Part:- -->

    <nav class="flex items-center justify-between bg-slate-600 p-4 text-white">
      <h1 class="text-2xl">My Site</h1>
      <ul class="hidden md:flex items-center gap-6">
        <li>Home</li>
        <li>Services</li>
        <li>About</li>
        <li>Contact Us</li>
      </ul>
      <button class="md:hidden text-2xl"><i class="ri-menu-line"></i></button>
    </nav>
    <div
      class="mobile-nav hidden flex flex-col gap-1.5 items-center bg-slate-300 text-white md:hidden"
    >
      <a class="hover:text-slate-600" href="#">Home</a>
      <a class="hover:text-slate-600" href="#">Services</a>
      <a class="hover:text-slate-600" href="#">About</a>
      <a class="hover:text-slate-600" href="#">Contact Us</a>
    </div>
    <script>
      //* JS Part:-
      const btn = document.querySelector('button');
      const mobNav = document.querySelector('.mobile-nav');

      btn.addEventListener('click', () => {
        mobNav.classList.toggle('hidden');
      });
    </script>
  </body>

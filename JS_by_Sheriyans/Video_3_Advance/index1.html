<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a project using (Call,Apply,Bind)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-black w-full h-screen">
    <div class="max-w-5xl mx-auto">
      <!-- Form -->
      <div class="bg-slate-200 p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold mb-6">Create Profile</h2>

        <form class="space-y-4">
          <div>
            <label class="block mb-2 font-medium">Name</label>
            <input
              id="name"
              type="text"
              placeholder="Enter your name"
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block mb-2 font-medium">Role</label>
            <input
              id="role"
              type="text"
              placeholder="Frontend Developer"
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block mb-2 font-medium">Bio</label>
            <textarea
              rows="4"
              id="bio"
              placeholder="Tell us about yourself..."
              class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
          </div>

          <div>
            <label class="block mb-2 font-medium">Profile Photo</label>
            <input id="url" type="url" class="w-full border rounded-lg p-2" />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition"
          >
            Submit
          </button>
        </form>
      </div>

      <!-- Cards Section -->
      <div class="mt-10">
        <h3 class="text-2xl font-bold mb-6">Profiles</h3>

        <div class="card-sec grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Card 1 -->

        </div>
      </div>
    </div>
    <script src="./script1.js"></script>
  </body>
</html>

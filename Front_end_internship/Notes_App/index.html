<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--* CSS File attached -->
    <link rel="stylesheet" href="style.css" />
    <!--* Toastify JS CSS File attached -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <title>Notes_App</title>
  </head>
  <body>
    <main>
      <h1 class="main-heading">Notes App</h1>
      <!-- Note add section -->
      <section id="create-note">
        <form action="" autocomplete="off">
          <h2>Create Note</h2>
          <div class="note-sec">
            <label for="heading">Heading</label>
            <input
              id="heading"
              type="text"
              placeholder="Enter note heading..."
            />
          </div>
          <div class="note-sec">
            <label for="details">Details</label>
            <textarea
              id="details"
              placeholder="Enter note details..."
            ></textarea>
          </div>
          <button class="addNoteBtn">Add note</button>
        </form>
      </section>
      <!-- All notes section -->
      <section id="allnotes-sec">
        <h3>All Notes</h3>
        <div class="notes"></div>
      </section>
    </main>
    <!--* JS File attached -->
    <script src="./script.js"></script>
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
  </body>
</html>
